<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="tg-hero-title tg-hero-desc">
  <title id="tg-hero-title">Teja Gelli — AI-augmented full-stack engineer</title>
  <desc id="tg-hero-desc">Full Stack Developer at T-Mobile, building Python pipelines, React dashboards, and LLM agents.</desc>
  <style>
    .name { font: 800 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F5F5FA; letter-spacing: -2.5px; }
    .role { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.6px; }
    .eyebrow { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #9BA1B4; letter-spacing: 3px; }
    .prompt { font: 500 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #22D3EE; }
    .ph { font: 500 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #C9CDDA; opacity: 0; }
    .ph0 { opacity: 1; }
    .meta { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #5E6378; letter-spacing: 2px; }
    .mono-mark { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; letter-spacing: -1px; }

    .blob-a { animation: tg-drift-a 18s ease-in-out infinite alternate; }
    .blob-b { animation: tg-drift-b 22s ease-in-out infinite alternate; }
    .blob-c { animation: tg-drift-c 26s ease-in-out infinite alternate; }
    .spin { transform-origin: 950px 196px; animation: tg-spin 24s linear infinite; }
    .spin-rev { transform-origin: 950px 196px; animation: tg-spin 38s linear infinite reverse; }
    .dial { transform-origin: 950px 196px; animation: tg-spin 120s linear infinite; }
    .dash { animation: tg-dash 6s linear infinite; }
    .core { transform-origin: 950px 196px; animation: tg-breathe 5s ease-in-out infinite; }
    .live { transform-origin: 80px 105px; animation: tg-ping 2.4s ease-out infinite; }
    .underline { transform-origin: 72px 0; animation: tg-grow 1.4s 0.3s cubic-bezier(.2,.8,.2,1) both; }
    .sheen { animation: tg-sheen 5s 1.6s ease-in-out infinite both; }
    .trace { stroke-dasharray: 1400; stroke-dashoffset: 0; animation: tg-draw 9s ease-in-out infinite both; }
    .caret { animation: tg-blink 1.1s steps(1) infinite; }
    .ph0 { animation: tg-ph 16s 0s infinite both; }
    .ph1 { animation: tg-ph 16s 4s infinite both; }
    .ph2 { animation: tg-ph 16s 8s infinite both; }
    .ph3 { animation: tg-ph 16s 12s infinite both; }

    @keyframes tg-drift-a { to { transform: translate(-60px, 30px); } }
    @keyframes tg-drift-b { to { transform: translate(50px, -40px); } }
    @keyframes tg-drift-c { to { transform: translate(-40px, -30px); } }
    @keyframes tg-spin { to { transform: rotate(360deg); } }
    @keyframes tg-dash { to { stroke-dashoffset: -120; } }
    @keyframes tg-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes tg-ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes tg-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes tg-sheen { 0% { transform: translateX(-160px); } 60%, 100% { transform: translateX(620px); } }
    @keyframes tg-draw { 0% { stroke-dashoffset: 1400; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1400; } }
    @keyframes tg-blink { 50% { opacity: 0; } }
    @keyframes tg-ph { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .live, .sheen { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="tg-hero-clip"><rect width="1200" height="400" rx="24"/></clipPath>
    <linearGradient id="tg-hero-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D16"/>
      <stop offset="1" stop-color="#07070C"/>
    </linearGradient>
    <radialGradient id="tg-hero-violet"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".75"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="tg-hero-cyan"><stop offset="0" stop-color="#22D3EE" stop-opacity=".5"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="tg-hero-pink"><stop offset="0" stop-color="#F472B6" stop-opacity=".4"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
    <pattern id="tg-hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tg-hero-gridfade" cx=".72" cy=".45" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="tg-hero-gridmask"><rect width="1200" height="400" fill="url(#tg-hero-gridfade)"/></mask>
    <linearGradient id="tg-hero-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset=".5" stop-color="#7C9BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="tg-hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset=".55" stop-color="#5B5BF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="tg-hero-trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".2" stop-color="#22D3EE" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#7C5CFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tg-hero-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tg-hero-topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".3" stop-color="#22D3EE" stop-opacity=".8"/>
      <stop offset=".7" stop-color="#7C5CFF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tg-hero-core" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#9F87FF"/>
      <stop offset=".6" stop-color="#5B5BF5"/>
      <stop offset="1" stop-color="#2A2A8F"/>
    </radialGradient>
    <clipPath id="tg-hero-underclip"><rect x="72" y="262" width="540" height="3" rx="1.5"/></clipPath>
    <filter id="tg-hero-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="tg-hero-glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg-hero-dotglow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tg-hero-clip)">
    <rect width="1200" height="400" fill="url(#tg-hero-bg)"/>

    <!-- moving colour mesh -->
    <g filter="url(#tg-hero-blur)">
      <circle class="blob-a" cx="930" cy="90" r="190" fill="url(#tg-hero-violet)"/>
      <circle class="blob-b" cx="1090" cy="320" r="170" fill="url(#tg-hero-cyan)"/>
      <circle class="blob-c" cx="660" cy="360" r="150" fill="url(#tg-hero-pink)"/>
      <circle class="blob-b" cx="120" cy="40" r="140" fill="url(#tg-hero-violet)" opacity=".45"/>
    </g>

    <!-- technical grid -->
    <rect width="1200" height="400" fill="url(#tg-hero-grid)" mask="url(#tg-hero-gridmask)"/>

    <!-- orbital geometry -->
    <g fill="none">
      <g class="dial"><path d="M1100.0 196.0L1109.0 196.0M1099.2 211.7L1103.2 212.1M1096.7 227.2L1100.6 228.0M1092.7 242.4L1096.5 243.6M1087.0 257.0L1090.7 258.6M1079.9 271.0L1087.7 275.5M1071.4 284.2L1074.6 286.5M1061.5 296.4L1064.4 299.0M1050.4 307.5L1053.0 310.4M1038.2 317.4L1040.5 320.6M1025.0 325.9L1029.5 333.7M1011.0 333.0L1012.6 336.7M996.4 338.7L997.6 342.5M981.2 342.7L982.0 346.6M965.7 345.2L966.1 349.2M950.0 346.0L950.0 355.0M934.3 345.2L933.9 349.2M918.8 342.7L918.0 346.6M903.6 338.7L902.4 342.5M889.0 333.0L887.4 336.7M875.0 325.9L870.5 333.7M861.8 317.4L859.5 320.6M849.6 307.5L847.0 310.4M838.5 296.4L835.6 299.0M828.6 284.2L825.4 286.5M820.1 271.0L812.3 275.5M813.0 257.0L809.3 258.6M807.3 242.4L803.5 243.6M803.3 227.2L799.4 228.0M800.8 211.7L796.8 212.1M800.0 196.0L791.0 196.0M800.8 180.3L796.8 179.9M803.3 164.8L799.4 164.0M807.3 149.6L803.5 148.4M813.0 135.0L809.3 133.4M820.1 121.0L812.3 116.5M828.6 107.8L825.4 105.5M838.5 95.6L835.6 93.0M849.6 84.5L847.0 81.6M861.8 74.6L859.5 71.4M875.0 66.1L870.5 58.3M889.0 59.0L887.4 55.3M903.6 53.3L902.4 49.5M918.8 49.3L918.0 45.4M934.3 46.8L933.9 42.8M950.0 46.0L950.0 37.0M965.7 46.8L966.1 42.8M981.2 49.3L982.0 45.4M996.4 53.3L997.6 49.5M1011.0 59.0L1012.6 55.3M1025.0 66.1L1029.5 58.3M1038.2 74.6L1040.5 71.4M1050.4 84.5L1053.0 81.6M1061.5 95.6L1064.4 93.0M1071.4 107.8L1074.6 105.5M1079.9 121.0L1087.7 116.5M1087.0 135.0L1090.7 133.4M1092.7 149.6L1096.5 148.4M1096.7 164.8L1100.6 164.0M1099.2 180.3L1103.2 179.9" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.2"/></g>
      <circle cx="950" cy="196" r="150" stroke="#FFFFFF" stroke-opacity=".08"/>
      <ellipse class="dash" cx="950" cy="196" rx="232" ry="78" transform="rotate(-16 950 196)" stroke="#7C5CFF" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="2 10"/>
      <ellipse cx="950" cy="196" rx="196" ry="112" transform="rotate(28 950 196)" stroke="#22D3EE" stroke-opacity=".22"/>
      <circle cx="950" cy="196" r="92" stroke="#FFFFFF" stroke-opacity=".06" stroke-dasharray="1 6"/>
    </g>
    <g class="spin"><circle cx="1100" cy="196" r="5" fill="#22D3EE" filter="url(#tg-hero-dotglow)"/></g>
    <g class="spin-rev"><circle cx="858" cy="196" r="3.5" fill="#F472B6" filter="url(#tg-hero-dotglow)"/></g>
    <g class="core">
      <circle cx="950" cy="196" r="62" fill="#7C5CFF" opacity=".18" filter="url(#tg-hero-blur)"/>
      <circle cx="950" cy="196" r="46" fill="url(#tg-hero-core)"/>
      <circle cx="950" cy="196" r="46" fill="none" stroke="#FFFFFF" stroke-opacity=".25"/>
      <text class="mono-mark" x="950" y="207" text-anchor="middle">TG</text>
    </g>

    <!-- signal trace -->
    <path class="trace" d="M40 352 H250 L262 340 L276 366 L290 330 L304 360 L316 352 H520 L530 344 H600 L610 352 H760 L772 334 L786 368 L800 352 H1160" fill="none" stroke="url(#tg-hero-trace)" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- copy -->
    <circle class="live" cx="80" cy="105" r="4" fill="#22D3EE"/>
    <circle cx="80" cy="105" r="4" fill="#22D3EE"/>
    <text class="eyebrow" x="96" y="110">FULL STACK DEVELOPER · T-MOBILE</text>
    <text class="name" x="68" y="192">Teja Gelli</text>
    <text class="role" x="72" y="244" fill="url(#tg-hero-text)">AI-augmented full-stack engineer</text>

    <g class="underline">
      <rect x="72" y="262" width="540" height="3" rx="1.5" fill="url(#tg-hero-line)" filter="url(#tg-hero-glow)"/>
    </g>
    <g clip-path="url(#tg-hero-underclip)">
      <rect class="sheen" x="72" y="258" width="120" height="11" fill="url(#tg-hero-sheen)"/>
    </g>

    <text class="prompt" x="72" y="318">&gt; building</text>
    <g>
      <text class="ph ph0" x="196" y="318">Python automation pipelines</text>
      <text class="ph ph1" x="196" y="318">React + TypeScript dashboards</text>
      <text class="ph ph2" x="196" y="318">LLM agents with deterministic guardrails</text>
      <text class="ph ph3" x="196" y="318">Spring Boot &amp; Flask services</text>
    </g>

    <text class="meta" x="1128" y="376" text-anchor="end">GITHUB.COM/TEJAGELLI668</text>

    <rect x="0" y="0" width="1200" height="1.5" fill="url(#tg-hero-topline)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
